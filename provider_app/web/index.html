<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jamui Services Partner Portal - जमुई के कुशल कारीगर एवं सेवा प्रदाता पार्टनर पोर्टल। अपने बिजनेस को नए ग्राहकों तक पहुँचाएँ।">
  <meta name="theme-color" content="#1E3A8A">

  <script>
    // Safe communication bridge to host Customer App WebView
    window.notifyJamuiHost = function(msg) {
      try {
        if (msg === 'PROVIDER_READY') {
          var splash = document.getElementById('flutter_web_loading_splash');
          if (splash) {
            splash.style.transition = 'opacity 0.35s ease';
            splash.style.opacity = '0';
            setTimeout(function() {
              if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            }, 350);
          }
        }
        if (window.JamuiHost && typeof window.JamuiHost.postMessage === 'function') {
          window.JamuiHost.postMessage(msg);
        }
      } catch (e) {
        console.warn('JamuiHost postMessage note:', e);
      }
    };

    // Safety fallback: Ensure HTML splash fades out after 9s in case of abnormal web delay
    setTimeout(function() {
      var splash = document.getElementById('flutter_web_loading_splash');
      if (splash) {
        splash.style.transition = 'opacity 0.4s ease';
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 400);
      }
    }, 9000);

    // Signal host WebView that base HTML & JS environment is loaded
    window.addEventListener('load', function() {
      window.notifyJamuiHost('HTML_READY');
    });
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jamui Services Partner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Jamui Services Partner - प्रोवाइडर बनें</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google reCAPTCHA v2 for Firebase Web Phone Auth -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <!-- Razorpay Checkout for Web -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openRazorpayWebCheckout = function(optionsJson, successCb, errorCb, dismissCb) {
      try {
        if (typeof Razorpay === 'undefined') {
          if (typeof errorCb === 'function') {
            errorCb(1, 'रेजरपे एसडीके लोड नहीं हो सका। कृपया इंटरनेट जांचें।');
          }
          return;
        }

        var opts = typeof optionsJson === 'string' ? JSON.parse(optionsJson) : Object.assign({}, optionsJson);

        opts.handler = function(response) {
          if (typeof successCb === 'function') {
            successCb(
              response.razorpay_payment_id || '',
              response.razorpay_order_id || '',
              response.razorpay_signature || ''
            );
          }
        };

        if (!opts.modal) opts.modal = {};
        var originalDismiss = opts.modal.ondismiss;
        opts.modal.ondismiss = function() {
          if (typeof originalDismiss === 'function') {
            try { originalDismiss(); } catch (_) {}
          }
          if (typeof dismissCb === 'function') {
            dismissCb();
          }
        };

        var rzp = new Razorpay(opts);

        rzp.on('payment.failed', function(resp) {
          var err = resp.error || {};
          var code = err.code || 0;
          var desc = err.description || err.reason || 'भुगतान विफल रहा।';
          if (typeof errorCb === 'function') {
            errorCb(code, desc);
          }
        });

        rzp.open();
      } catch (e) {
        if (typeof errorCb === 'function') {
          errorCb(100, e && e.message ? e.message : 'भुगतान विंडो खोलने में विफल');
        }
      }
    };
  </script>
  <style>
    #recaptcha-container {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 2147483647 !important;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      pointer-events: none;
    }
    #recaptcha-container > * {
      pointer-events: auto;
    }
    .grecaptcha-badge {
      z-index: 2147483647 !important;
    }
    iframe[title*="recaptcha"], iframe[src*="recaptcha"] {
      z-index: 2147483647 !important;
    }
  </style>
</head>
<body>
  <!-- Seamless Fallback Splash until Flutter Web Engine mounts (Zero Blank Screen) -->
  <div id="flutter_web_loading_splash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:-apple-system,BlinkMacSystemFont,Roboto,Helvetica,sans-serif;">
    <div style="width:64px;height:64px;border-radius:18px;background:#0C7A60;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px rgba(12,122,96,0.2);">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
      </svg>
    </div>
    <div style="margin-top:20px;font-size:16px;font-weight:700;color:#0F172A;letter-spacing:0.2px;">Jamui Services Partner</div>
    <div style="margin-top:6px;font-size:13px;color:#64748B;">पोर्टल लोड हो रहा है...</div>
    <div style="margin-top:22px;width:160px;height:4px;background:#E2E8F0;border-radius:6px;overflow:hidden;position:relative;">
      <div style="width:60px;height:100%;background:#0C7A60;border-radius:6px;position:absolute;animation:jamui_shimmer 1.5s ease-in-out infinite;"></div>
    </div>
    <style>
      @keyframes jamui_shimmer {
        0% { left: -60px; }
        50% { left: 80px; }
        100% { left: 160px; }
      }
    </style>
  </div>
  <!-- Container for Firebase Phone Auth reCAPTCHA on Web -->
  <div id="recaptcha-container"></div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
